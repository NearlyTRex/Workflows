name: Diff paths
description: >-
  Stages the changes under paths, new files included, and writes them as a
  binary patch for commit-patch to apply in another job. Outputs changed. See
  diff_paths.py.

inputs:
  paths:
    description: Files or directories, separated by spaces or newlines
    required: true
  patch:
    description: >-
      Where to write the patch, by default changes.patch in the runner's temp
      directory. Not written when nothing changed
    required: false
    default: ""

outputs:
  changed:
    description: '"true" when anything under paths changed'
    value: ${{ steps.diff.outputs.changed }}

runs:
  using: composite
  steps:
    - id: diff
      shell: bash
      env:
        SCRIPT: ${{ github.action_path }}/diff_paths.py
        PATHS: ${{ inputs.paths }}
        PATCH: ${{ inputs.patch }}
      run: python3 "$SCRIPT"
