name: PyPI publish
description: >-
  Publishes the sdist and wheel that python-build.yml uploaded, earlier in the
  same run, to PyPI through trusted publishing. Use it as a step of a job in
  the repo's own release workflow, never from a reusable workflow: PyPI checks
  the workflow file that runs the job against the project's trusted publisher,
  and does not accept one called from another repository. The job needs
  id-token: write and the environment the trusted publisher names.

inputs:
  artifact-name:
    description: The artifact holding the distributions
    required: false
    default: dist

runs:
  using: composite
  steps:
    - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/pypi-dist

    - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
      with:
        packages-dir: ${{ runner.temp }}/pypi-dist
