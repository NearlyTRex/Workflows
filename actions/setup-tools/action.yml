name: Set up workflow tools
description: >-
  Installs zizmor, pip-audit, ruff, shellcheck and rumdl from a hash-locked file
  into a private venv at $RUNNER_TEMP/workflow-tools. Later steps call them by full
  path, so PATH and the caller's own Python are left alone.

runs:
  using: composite
  steps:
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      id: python
      with:
        python-version: "3.12"
        update-environment: false

    - name: Install tools
      shell: bash
      env:
        PYTHON: ${{ steps.python.outputs.python-path }}
        LOCK: ${{ github.action_path }}/requirements.txt
      run: |
        venv="$RUNNER_TEMP/workflow-tools"
        "$PYTHON" -m venv "$venv"
        "$venv/bin/pip" install --quiet --disable-pip-version-check --require-hashes --no-deps -r "$LOCK"
