name: LLVM
description: >-
  Installs an LLVM release from apt.llvm.org beside the runner's own clang: clang-N with
  clang-format, clang-tidy, lld, llvm-cov and libc++, all named with the version. See
  install_llvm.py.

inputs:
  version:
    description: The LLVM release, e.g. 23
    required: true
  on-path:
    description: Put the release's unversioned tools (clang, clang-tidy, lld) first on PATH
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - shell: bash
      env:
        SCRIPT: ${{ github.action_path }}/install_llvm.py
        LLVM_VERSION: ${{ inputs.version }}
        LLVM_ON_PATH: ${{ inputs.on-path }}
      run: python3 "$SCRIPT"
