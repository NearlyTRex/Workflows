name: LLVM
description: >-
  Installs an LLVM release: on Linux from apt.llvm.org beside the runner's own clang, clang-N with
  clang-format, clang-tidy, lld, llvm-cov and libc++, all named with the version; on Windows from
  LLVM's own Windows archive, checked against its sha256, with its bin first on PATH. See
  install_llvm.py.

inputs:
  version:
    description: The LLVM release, e.g. 23
    required: true
  on-path:
    description: >-
      Put the release's unversioned tools (clang, clang-tidy, lld) first on PATH; on Windows they
      always are, since they carry no version
    required: false
    default: "false"
  token:
    description: The token that looks LLVM's Windows releases up, so the API's limits are the repo's
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - shell: bash
      env:
        SCRIPT: ${{ github.action_path }}/install_llvm.py
        LLVM_VERSION: ${{ inputs.version }}
        LLVM_ON_PATH: ${{ inputs.on-path }}
        GITHUB_TOKEN: ${{ inputs.token }}
      # The runner's own Python. On Windows python3 can be the Microsoft Store stub.
      run: |
        if [ "$RUNNER_OS" = Windows ]; then python="python"; else python="python3"; fi
        "$python" "$SCRIPT"
