name: Build environment
description: >-
  Sets up the environment for a C/C++ build: parallel jobs on every core,
  optionally ccache (Linux and macOS runners), and the ci-phase and ci-clang-tidy
  commands on PATH. See build_env.py.

inputs:
  parallel:
    required: false
    default: "true"
  ccache:
    required: false
    default: "false"
  ccache-dir:
    required: false
    default: ""
  ccache-max-size:
    required: false
    default: 500M
  ccache-sloppiness:
    required: false
    default: pch_defines,time_macros,include_file_mtime,include_file_ctime

runs:
  using: composite
  steps:
    # A container job usually runs as root, without sudo.
    - name: Install ccache
      if: inputs.ccache == 'true' && runner.os == 'Linux'
      shell: bash
      run: |
        sudo=""; if [ "$(id -u)" != 0 ]; then sudo="sudo"; fi
        $sudo apt-get install -y --no-install-recommends ccache

    - name: Install ccache (Homebrew)
      id: brew-ccache
      if: inputs.ccache == 'true' && runner.os == 'macOS'
      shell: bash
      run: |
        brew install ccache
        echo "wrappers=$(brew --prefix)/opt/ccache/libexec" >> "$GITHUB_OUTPUT"

    - name: Export the build environment
      shell: bash
      env:
        SCRIPT: ${{ github.action_path }}/build_env.py
        TOOLS: ${{ github.action_path }}
        PARALLEL: ${{ inputs.parallel }}
        CCACHE: ${{ inputs.ccache }}
        CCACHE_DIR: ${{ inputs.ccache-dir }}
        MAX_SIZE: ${{ inputs.ccache-max-size }}
        SLOPPINESS: ${{ inputs.ccache-sloppiness }}
        CCACHE_WRAPPERS: ${{ steps.brew-ccache.outputs.wrappers }}
      # The runner's own Python. On Windows python3 can be the Microsoft Store stub.
      run: |
        if [ "$RUNNER_OS" = Windows ]; then python="python"; else python="python3"; fi
        "$python" "$SCRIPT"
