name: Test coverage gate
description: >-
  Runs the tests under coverage.py and fails when coverage is below the threshold.
  Uses the repo's own .coveragerc or [tool.coverage] config when it has one;
  otherwise it measures every Python file under the working directory with
  branch coverage, so a module no test imports still counts against the total.
  Needs the project's Python already set up.

inputs:
  test-command:
    description: A Python module and its arguments, run as "coverage run -m <test-command>"
    required: false
    default: pytest -q
  fail-under:
    description: Minimum total coverage percent
    required: false
    default: "100"
  working-directory:
    required: false
    default: "."

runs:
  using: composite
  steps:
    - name: Install coverage.py
      shell: bash
      env:
        LOCK: ${{ github.action_path }}/requirements.txt
      run: python -m pip install --quiet --disable-pip-version-check --require-hashes --no-deps -r "$LOCK"

    - name: Tests with coverage
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        TEST_COMMAND: ${{ inputs.test-command }}
        FAIL_UNDER: ${{ inputs.fail-under }}
      run: |
        if [ -f .coveragerc ] || grep -qs '^\[tool\.coverage' pyproject.toml; then
          options=()
        else
          options=(--branch --source=.)
        fi
        read -ra command <<< "$TEST_COMMAND"
        python -m coverage run "${options[@]}" -m "${command[@]}"
        python -m coverage report --fail-under="$FAIL_UNDER" --show-missing --skip-covered
