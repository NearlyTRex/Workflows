name: Self CI

# This repo's own checks. The reusable workflows are exercised for real: the
# fixture project goes through python-ci, and the repo itself through lint.
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes --no-deps -r requirements-dev.txt
      - uses: $/actions/coverage

  fixture:
    name: Fixture
    uses: $/.github/workflows/python-ci.yml
    permissions:
      contents: read
    with:
      working-directory: tests/fixtures/python-app

  lint:
    name: Lint
    uses: $/.github/workflows/lint.yml
    permissions:
      contents: read

  compose:
    name: Compose
    uses: $/.github/workflows/compose-test.yml
    permissions:
      contents: read
    with:
      compose-file: tests/fixtures/compose/compose.yml
      health-url: http://127.0.0.1:8000/
      commands: curl -sf http://127.0.0.1:8000/ | grep -q "Directory listing"

  installer:
    name: Installer
    uses: $/.github/workflows/inno-setup.yml
    permissions:
      contents: read
    with:
      script: tests/fixtures/installer/fixture.iss
      version: 0.0.0-ci
      output-dir: tests/fixtures/installer/dist
      smoke-test: tests\fixtures\installer\smoke-test.ps1
      artifact: fixture-installer

  cpp:
    name: C++ (${{ matrix.os }})
    uses: $/.github/workflows/cpp-build.yml
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    with:
      runs-on: ${{ matrix.os }}
      # Ninja rather than the Visual Studio generator on Windows, so the build
      # only works if the MSVC setup really put cl.exe on PATH.
      msvc: ${{ matrix.os == 'windows-latest' }}
      # Linux only; the Windows leg checks it is skipped cleanly.
      ccache: true
      cache-key: fixture-cpp
      build-command: |
        cmake -S tests/fixtures/cpp-app -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
        cmake --build build --parallel
      test-command: ctest --test-dir build --output-on-failure
      artifact: fixture-cpp-${{ matrix.os }}
      artifact-path: build/fixture_test*
