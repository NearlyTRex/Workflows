name: Self CI

# This repo's own checks. The reusable workflows are exercised for real: the
# fixture project goes through python-ci, shell coverage included, and the
# repo itself through lint.
# self-release.yml calls it too, so a release waits for all of it.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions: {}

# github.workflow is the caller's name when self-release.yml calls this, so its
# run gets a group of its own and never queues behind, or displaces, this one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only pull requests: a newer push supersedes their run. On main every run
  # finishes, since each push's secret scan covers only that push's commits.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes --no-deps -r requirements-dev.txt
      # The shell sandbox's tests build real user namespaces, which Ubuntu 24.04
      # runners restrict; skipped, they would leave the sandbox uncovered.
      - name: Allow user namespaces
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      - uses: $/actions/coverage

  fixture:
    name: Fixture
    uses: $/.github/workflows/python-ci.yml
    permissions:
      contents: read
    with:
      working-directory: tests/fixtures/python-app
      # Its install script must be fully run by the tests, || handler included,
      # one of them in the shell sandbox.
      shell-coverage-source: scripts
      shell-coverage-branch: true
      shell-sandbox: true

  # The fixture built from its hash-locked backend, as a release builds a
  # package for PyPI; publishing itself needs a real trusted publisher
  fixture-build:
    name: Fixture build
    uses: $/.github/workflows/python-build.yml
    permissions:
      contents: read
    with:
      working-directory: tests/fixtures/python-app
      artifact-name: fixture-dist

  lint:
    name: Lint
    uses: $/.github/workflows/lint.yml
    permissions:
      contents: read

  compose:
    name: Compose
    uses: $/.github/workflows/compose-test.yml
    permissions:
      contents: read
    with:
      compose-file: tests/fixtures/compose/compose.yml
      health-url: http://127.0.0.1:8000/
      commands: curl -sf http://127.0.0.1:8000/ | grep -q "Directory listing"

  installer:
    name: Installer
    uses: $/.github/workflows/inno-setup.yml
    permissions:
      contents: read
    with:
      script: tests/fixtures/installer/fixture.iss
      version: 0.0.0-ci
      output-dir: tests/fixtures/installer/dist
      smoke-test: tests\fixtures\installer\smoke-test.ps1
      artifact: fixture-installer

  cpp:
    name: C++ (${{ matrix.os }})
    uses: $/.github/workflows/cpp-build.yml
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    with:
      runs-on: ${{ matrix.os }}
      # Ninja rather than the Visual Studio generator on Windows, so the build
      # only works if the MSVC setup really put cl.exe on PATH.
      msvc: ${{ matrix.os == 'windows-latest' }}
      # Linux only; the Windows leg checks it is skipped cleanly.
      ccache: true
      cache-key: fixture-cpp
      # Skipped on Windows, like ccache.
      apt-packages: clang clang-tidy llvm
      rolling-cache-paths: .tidy-cache
      # ci-phase on both runners, so its launcher is tested on Windows too.
      # ci-clang-tidy runs twice on Linux: the second run must find every file
      # in the cache it just filled. Linux also builds the fixture with clang's
      # coverage instrumentation for ci-cpp-coverage.
      build-command: |
        ci-phase Configure cmake -S tests/fixtures/cpp-app -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
        ci-phase Build cmake --build build --parallel
        if [ "$RUNNER_OS" = Linux ]; then
          ci-phase Tidy ci-clang-tidy -p build --cache-dir .tidy-cache
          ci-clang-tidy -p build --cache-dir .tidy-cache | tee tidy.log
          grep -q ", 0 checked, 0 failed" tidy.log
          ci-phase "Configure (coverage)" cmake -S tests/fixtures/cpp-app -B build-coverage -G Ninja \
            -DCMAKE_CXX_COMPILER=clang++ \
            "-DCMAKE_CXX_FLAGS=-fprofile-instr-generate -fcoverage-mapping" \
            -DCMAKE_EXE_LINKER_FLAGS=-fprofile-instr-generate
          ci-phase "Build (coverage)" cmake --build build-coverage --parallel
        fi
      # The test's own failure branches never run, so it is left out of the gate.
      test-command: |
        ci-phase Test ctest --test-dir build --output-on-failure
        if [ "$RUNNER_OS" = Linux ]; then
          ci-phase Coverage ci-cpp-coverage --object build-coverage/fixture_test --exclude '_test\.cpp$' \
            --fail-under regions=100 -- ctest --test-dir build-coverage --output-on-failure
        fi
      artifact: fixture-cpp-${{ matrix.os }}
      artifact-path: build/fixture_test*

  # The PS4 fixture cross-built with the OpenOrbis SDK, made into eboot.bin and
  # a .prx, and packaged and validated with the SDK's own tools, so the toolchain
  # file and package helpers are tested as callers use them.
  ps4:
    name: PS4
    uses: $/.github/workflows/cpp-build.yml
    permissions:
      contents: read
    with:
      openorbis-version: 0.5.4
      build-command: |
        ci-phase Configure cmake -S tests/fixtures/ps4-app -B build -G Ninja \
          -DCMAKE_TOOLCHAIN_FILE="$OPENORBIS_TOOLCHAIN_FILE"
        ci-phase Build cmake --build build
      # What the package holds, listed by the SDK's PkgTool from the package itself.
      test-command: |
        PkgTool.Core pkg_listentries build/IV0000-WFLO00001_00-WORKFLOWSFIXTURE.pkg | tee entries.txt
        PkgTool.Core sfo_listentries build/fixture_pkg-ps4/stage/sce_sys/param.sfo | tee sfo.txt
        grep -q "Workflows PS4 Fixture" sfo.txt
      artifact: fixture-ps4
      artifact-path: build/IV0000-WFLO00001_00-WORKFLOWSFIXTURE.pkg

  # The Switch fixture built in devkitPro's pinned image with devkitPro's own
  # Switch.cmake, and made into an NRO with a NACP and a romfs; ccache too, so
  # its install and launcher are tested inside a container.
  switch:
    name: Switch
    uses: $/.github/workflows/cpp-build.yml
    permissions:
      contents: read
    with:
      devkitpro: switch
      ccache: true
      cache-key: fixture-switch
      build-command: |
        ci-phase Configure cmake -S tests/fixtures/switch-app -B build -G Ninja \
          -DCMAKE_TOOLCHAIN_FILE="$DEVKITPRO/cmake/Switch.cmake"
        ci-phase Build cmake --build build
      # An NRO's header carries NRO0 at byte 16.
      test-command: test "$(head -c 20 build/fixture.nro | tail -c 4)" = NRO0
      artifact: fixture-switch
      artifact-path: build/fixture.nro

  # The C++ fixture's MSVC build, run on Windows by windows-test under full
  # page heap.
  windows-test:
    name: Windows test
    needs: cpp
    uses: $/.github/workflows/windows-test.yml
    permissions:
      contents: read
    with:
      artifact: fixture-cpp-windows-latest

  # Real attestations of the C++ fixture builds, since attesting has no dry run.
  # A pull request from a fork can't mint the signing token, so it skips this.
  attest:
    name: Attest
    needs: cpp
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: $/.github/workflows/attest.yml
    permissions:
      id-token: write
      attestations: write
    with:
      artifacts: fixture-cpp-*

  # The release workflow end to end, short of creating anything: downloads the
  # C++ fixture builds as assets, renders the notes, writes the checksums and
  # prints the gh commands it would run. It proceeds even though this
  # library's VERSION is already tagged. It needs contents: write only because
  # release.yml's job declares it; a dry run writes nothing, and a pull request
  # from a fork gets a read-only token regardless.
  release-dry-run:
    name: Release (dry run)
    needs: cpp
    uses: $/.github/workflows/release.yml
    permissions:
      contents: write # release.yml's job declares it; a dry run writes nothing
    with:
      version-file: VERSION
      title: Workflows
      assets: fixture-cpp-*
      checksums: true
      notes-file: tests/fixtures/release-notes.md
      dry-run: true
