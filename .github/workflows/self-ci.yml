name: Self CI

# This repo's own checks. The reusable workflows are exercised for real: the
# fixture project goes through python-ci, and the repo itself through lint.
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install --require-hashes --no-deps -r requirements-dev.txt
      - uses: $/actions/coverage

  fixture:
    name: Fixture
    uses: $/.github/workflows/python-ci.yml
    permissions:
      contents: read
    with:
      working-directory: tests/fixtures/python-app

  lint:
    name: Lint
    uses: $/.github/workflows/lint.yml
    permissions:
      contents: read
