name: Prepare Release

# Stage one of a release: bump the version file on a release/vX.Y.Z branch and
# open a pull request. Merging it lets release.yml tag and publish.
on:
  workflow_call:
    inputs:
      bump:
        description: patch, minor, major or X.Y.Z
        type: string
        required: true
      version-file:
        description: pyproject.toml, package.json, CMakeLists.txt or a plain VERSION file
        type: string
        required: true
      tag-prefix:
        type: string
        default: v
    outputs:
      version:
        value: ${{ jobs.prepare.outputs.version }}

permissions: {}

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # Credentials stay on so the job can push the release branch.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]

      - id: version
        uses: $/actions/version
        with:
          file: ${{ inputs.version-file }}
          bump: ${{ inputs.bump }}

      - name: Open pull request
        uses: $/actions/release-pr
        with:
          tag: ${{ inputs.tag-prefix }}${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.version }}
          version-file: ${{ inputs.version-file }}
