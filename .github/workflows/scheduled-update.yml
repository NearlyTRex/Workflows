name: Scheduled Update

# Regenerates files with the repo's own command, such as a data export, and
# commits whatever changed back to the branch the run started from. The command
# runs in a job that can only read the repo; a second job that runs none of the
# repo's code applies the result and pushes it, so a compromised dependency of
# the command never holds a token that can write.
on:
  workflow_call:
    inputs:
      command:
        description: Regenerates the files, run with bash from the repo root
        type: string
        required: true
      paths:
        description: >-
          The files or directories the command writes, separated by spaces or newlines. Only
          changes under them are committed.
        type: string
        required: true
      commit-message:
        description: "{date} is replaced by the run's UTC date"
        type: string
        default: "Update generated files: {date}"
      node-version:
        description: Set up this Node.js version, with npm's download cache, before the command
        type: string
        default: ""
      timeout-minutes:
        type: number
        default: 60
    outputs:
      changed:
        description: Whether the command changed anything under paths
        value: ${{ jobs.generate.outputs.changed }}

permissions: {}

jobs:
  generate:
    name: Generate
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: inputs.node-version != ''
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Command
        env:
          COMMAND: ${{ inputs.command }}
        run: bash -euo pipefail -c "$COMMAND"

      - id: diff
        uses: $/actions/diff-paths
        with:
          paths: ${{ inputs.paths }}

      - if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scheduled-update-patch
          path: ${{ runner.temp }}/changes.patch
          retention-days: 1

  commit:
    name: Commit
    needs: generate
    if: needs.generate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    # One push at a time per branch, so two runs never race to the same commit.
    concurrency:
      group: scheduled-update-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      # Credentials stay on so the job can push. It only applies a patch and
      # runs none of the repo's code. The branch's tip, not the commit the
      # command ran on: the branch may have moved since. A patch that no longer
      # applies fails the run, and the next one starts from the new tip.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: scheduled-update-patch
          path: ${{ runner.temp }}

      - uses: $/actions/commit-patch
        with:
          message: ${{ inputs.commit-message }}
