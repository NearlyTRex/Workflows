name: Scheduled Update

# Regenerates files with the repo's own command, such as a data export, and
# opens a pull request with whatever changed into the branch the run started
# from. The command runs in a job that can only read the repo; a second job that
# runs none of the repo's code commits the result and opens the pull request, so
# a compromised dependency of the command never holds a token that can write.
on:
  workflow_call:
    inputs:
      command:
        description: Regenerates the files, run with bash from the repo root
        type: string
        required: true
      paths:
        description: >-
          The files or directories the command writes, separated by spaces or newlines. Only
          changes under them are committed.
        type: string
        required: true
      commit-message:
        description: "The commit message and the pull request's title. {date} is replaced by the run's UTC date"
        type: string
        default: "Update generated files: {date}"
      pr-branch:
        description: >-
          The branch the pull request is opened from, by default scheduled-update/<base branch>.
          Each run force-pushes it, so the one pull request always holds the latest changes.
        type: string
        default: ""
      assignees:
        description: Who the pull request is assigned to, as GitHub logins separated by spaces or commas
        type: string
        default: ""
      node-version:
        description: Set up this Node.js version, with npm's download cache, before the command
        type: string
        default: ""
      timeout-minutes:
        type: number
        default: 60
    outputs:
      changed:
        description: Whether the command changed anything under paths
        value: ${{ jobs.generate.outputs.changed }}
      pr-url:
        description: The pull request's URL, when anything changed
        value: ${{ jobs.pull-request.outputs.url }}

permissions: {}

jobs:
  generate:
    name: Generate
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: inputs.node-version != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm

      - name: Command
        env:
          COMMAND: ${{ inputs.command }}
        run: bash -euo pipefail -c "$COMMAND"

      - id: diff
        uses: $/actions/diff-paths
        with:
          paths: ${{ inputs.paths }}

      - if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scheduled-update-patch
          path: ${{ runner.temp }}/changes.patch
          retention-days: 1

  pull-request:
    name: Pull request
    needs: generate
    if: needs.generate.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      url: ${{ steps.pr.outputs.url }}
    # One push at a time per branch, so two runs never race to the same commit.
    concurrency:
      group: scheduled-update-${{ github.repository }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      # Credentials stay on so the job can push. It only applies a patch and
      # runs none of the repo's code. The base branch's tip, not the commit the
      # command ran on: the branch may have moved since. A patch that no longer
      # applies fails the run, and the next one starts from the new tip.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scheduled-update-patch
          path: ${{ runner.temp }}

      - id: commit
        uses: $/actions/commit-patch
        with:
          message: ${{ inputs.commit-message }}
          branch: ${{ inputs.pr-branch || format('scheduled-update/{0}', github.ref_name) }}
          force: "true"

      - id: pr
        uses: $/actions/open-pr
        with:
          head: ${{ inputs.pr-branch || format('scheduled-update/{0}', github.ref_name) }}
          title: ${{ steps.commit.outputs.message }}
          body: >-
            Opened by the ${{ github.workflow }} workflow, which force-pushes this branch on
            every run that finds changes, so this pull request always holds the latest ones.
            Merge it whenever, or leave it to pick up the next run's.
          assignees: ${{ inputs.assignees }}
