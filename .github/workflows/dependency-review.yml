name: Dependency Review

# Fails a pull request that adds a dependency with a known vulnerability.
on:
  workflow_call:
    inputs:
      runs-on:
        description: The runner label; a versioned one, such as ubuntu-24.04, keeps the job on one image
        type: string
        default: ubuntu-latest
      fail-on-severity:
        type: string
        default: moderate

permissions: {}

jobs:
  review:
    name: Review
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: ${{ inputs.fail-on-severity }}
