name: Container Scan

# Builds the image and fails on HIGH or CRITICAL vulnerabilities that have a fix.
# With config-scan, also fails on misconfigurations in the Dockerfile's directory.
on:
  workflow_call:
    inputs:
      dockerfile:
        type: string
        default: Dockerfile
      context:
        type: string
        default: "."
      severity:
        type: string
        default: HIGH,CRITICAL
      config-scan:
        description: Also scan the Dockerfile's directory for misconfigurations, such as running as root
        type: boolean
        default: false

permissions: {}

jobs:
  scan:
    name: Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and save the image
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
          CONTEXT: ${{ inputs.context }}
        run: |
          docker build -f "$DOCKERFILE" -t container-scan:local "$CONTEXT"
          docker save container-scan:local -o .container-scan.tar

      - uses: $/actions/trivy
        with:
          input: .container-scan.tar
          severity: ${{ inputs.severity }}

      - name: Find the Dockerfile's directory
        if: inputs.config-scan
        id: config
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
        run: echo "path=$(dirname "$DOCKERFILE")" >> "$GITHUB_OUTPUT"

      - if: inputs.config-scan
        uses: $/actions/trivy-config
        with:
          path: ${{ steps.config.outputs.path }}
          severity: ${{ inputs.severity }}
