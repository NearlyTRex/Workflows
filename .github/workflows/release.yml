name: Release

# Stage two of a release: when the version in the version file has no tag yet,
# tag this commit and publish a GitHub Release with generated notes. Anything
# else is a no-op, so it is safe to run on every push to the default branch.
on:
  workflow_call:
    inputs:
      version-file:
        type: string
        required: true
      tag-prefix:
        type: string
        default: v
      title:
        description: Release title prefix; defaults to the repository name
        type: string
        default: ""
      draft:
        description: Publish as a draft to review before announcing
        type: boolean
        default: false
      assets:
        description: Artifact name pattern from earlier jobs in this run to attach to the release
        type: string
        default: ""
      checksums:
        description: Also attach SHA256SUMS.txt covering the assets, so downloads can be verified
        type: boolean
        default: false
      notes-file:
        description: >-
          Markdown file placed above the generated notes, such as install instructions.
          {version}, {tag} and {repository} in it are replaced.
        type: string
        default: ""
    outputs:
      released:
        value: ${{ jobs.release.outputs.released }}
      version:
        value: ${{ jobs.release.outputs.version }}

permissions: {}

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      released: ${{ steps.tag.outputs.released }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: version
        uses: $/actions/version
        with:
          file: ${{ inputs.version-file }}

      - id: check
        name: Check for tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag-prefix }}${{ steps.version.outputs.version }}
        run: |
          if gh api "repos/$REPO/git/ref/tags/$TAG" --silent 2>/dev/null; then
            echo "$TAG already exists; nothing to release"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.check.outputs.exists == 'false' && inputs.assets != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ inputs.assets }}
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true

      # The tag is created first so a draft release, which doesn't create its
      # tag until published, still marks this version as released.
      - id: tag
        name: Tag and publish
        if: steps.check.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          TAG: ${{ inputs.tag-prefix }}${{ steps.version.outputs.version }}
          VERSION: ${{ steps.version.outputs.version }}
          TITLE: ${{ inputs.title || github.event.repository.name }}
          DRAFT: ${{ inputs.draft }}
          ASSETS_DIR: ${{ runner.temp }}/release-assets
          CHECKSUMS: ${{ inputs.checksums }}
          NOTES_FILE: ${{ inputs.notes-file }}
        run: |
          gh api "repos/$REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$SHA" --silent
          args=(--repo "$REPO" --verify-tag --title "$TITLE $VERSION" --generate-notes)
          if [ "$DRAFT" = "true" ]; then args+=(--draft); fi
          # gh puts the given notes above the generated ones.
          if [ -n "$NOTES_FILE" ]; then
            notes="$RUNNER_TEMP/release-notes.md"
            sed -e "s|{version}|$VERSION|g" -e "s|{tag}|$TAG|g" -e "s|{repository}|$REPO|g" \
              "$NOTES_FILE" > "$notes"
            args+=(--notes-file "$notes")
          fi
          assets=()
          if [ -d "$ASSETS_DIR" ]; then
            mapfile -t assets < <(find "$ASSETS_DIR" -type f | sort)
          fi
          if [ "$CHECKSUMS" = "true" ] && [ "${#assets[@]}" -gt 0 ]; then
            (cd "$ASSETS_DIR" && find . -type f -printf '%P\0' | sort -z | xargs -0 sha256sum) \
              > "$RUNNER_TEMP/SHA256SUMS.txt"
            assets+=("$RUNNER_TEMP/SHA256SUMS.txt")
          fi
          gh release create "$TAG" "${args[@]}" "${assets[@]}"
          echo "released=true" >> "$GITHUB_OUTPUT"
