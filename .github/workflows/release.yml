name: Release

# Stage two of a release: when the version in the version file has no tag yet,
# tag this commit and publish a GitHub Release with generated notes. Anything
# else is a no-op, so it is safe to run on every push to the default branch.
on:
  workflow_call:
    inputs:
      version-file:
        type: string
        required: true
      tag-prefix:
        type: string
        default: v
      title:
        description: Release title prefix; defaults to the repository name
        type: string
        default: ""
      draft:
        description: Publish as a draft to review before announcing
        type: boolean
        default: false
      assets:
        description: Artifact name pattern from earlier jobs in this run to attach to the release
        type: string
        default: ""
      checksums:
        description: Also attach SHA256SUMS.txt covering the assets, so downloads can be verified
        type: boolean
        default: false
      notes-file:
        description: >-
          Markdown file placed above the generated notes, such as install instructions.
          {version}, {tag} and {repository} in it are replaced.
        type: string
        default: ""
      dry-run:
        description: >-
          Do everything except create the tag and the release, even when the version is
          already tagged, and print the commands instead. For testing a release setup.
        type: boolean
        default: false
    outputs:
      released:
        value: ${{ jobs.release.outputs.released }}
      version:
        value: ${{ jobs.release.outputs.version }}

permissions: {}

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      released: ${{ steps.tag.outputs.released }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - id: version
        uses: $/actions/version
        with:
          file: ${{ inputs.version-file }}

      - id: check
        name: Check for tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag-prefix }}${{ steps.version.outputs.version }}
        run: |
          if gh api "repos/$REPO/git/ref/tags/$TAG" --silent 2>/dev/null; then
            echo "$TAG already exists; nothing to release"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - if: (steps.check.outputs.exists == 'false' || inputs.dry-run) && inputs.assets != ''
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: ${{ inputs.assets }}
          path: ${{ runner.temp }}/release-assets
          merge-multiple: true

      # The tag is created first so a draft release, which doesn't create its
      # tag until published, still marks this version as released. Publishing
      # is all or nothing: see actions/publish-release.
      - id: tag
        name: Tag and publish
        if: steps.check.outputs.exists == 'false' || inputs.dry-run
        uses: $/actions/publish-release
        with:
          tag: ${{ inputs.tag-prefix }}${{ steps.version.outputs.version }}
          version: ${{ steps.version.outputs.version }}
          title: ${{ inputs.title || github.event.repository.name }}
          draft: ${{ inputs.draft }}
          assets-dir: ${{ inputs.assets != '' && format('{0}/release-assets', runner.temp) || '' }}
          checksums: ${{ inputs.checksums }}
          notes-file: ${{ inputs.notes-file }}
          dry-run: ${{ inputs.dry-run }}
