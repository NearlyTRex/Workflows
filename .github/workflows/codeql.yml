name: CodeQL

on:
  workflow_call:
    inputs:
      runs-on:
        description: The runner label; a versioned one, such as ubuntu-24.04, keeps the job on one image
        type: string
        default: ubuntu-latest
      languages:
        description: 'JSON list of CodeQL languages, e.g. ["python", "actions"] or ["c-cpp"]'
        type: string
        default: '["actions"]'
      build-mode:
        description: none, autobuild or manual
        type: string
        default: none
      build-command:
        description: Build commands when build-mode is manual
        type: string
        default: ""

permissions: {}

jobs:
  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.languages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ inputs.build-mode }}

      - name: Build
        if: inputs.build-mode == 'manual'
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: bash -euo pipefail -c "$BUILD_COMMAND"

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
