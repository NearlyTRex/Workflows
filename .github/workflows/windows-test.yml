name: Windows Test

# Runs test programs built elsewhere on Windows itself: a mingw-w64 cross build,
# say, which otherwise only ever runs under wine. The caller uploads a folder of
# programs with the DLLs and data they need as an artifact, typically from a
# cpp-build job's artifact input, and names it here:
#
#   windows-test:
#     needs: build-windows-tests
#     uses: NearlyTRex/Workflows/.github/workflows/windows-test.yml@<sha> # vX.Y.Z
#     with:
#       artifact: windows-tests
#
# Each program runs under full page heap unless page-heap is false, and a
# failing one runs again under cdb for its stack. See actions/windows-test.
on:
  workflow_call:
    inputs:
      artifact:
        description: Name of the uploaded artifact holding the test programs
        type: string
        required: true
      runs-on:
        type: string
        default: windows-latest
      page-heap:
        description: Run each program under full page heap
        type: boolean
        default: true
      timeout:
        description: Seconds each program may run
        type: number
        default: 300
      timeout-minutes:
        description: How long the job may run before it is cancelled
        type: number
        default: 30

permissions: {}

jobs:
  test:
    name: Test
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact }}
          path: ${{ runner.temp }}/windows-test

      - uses: $/actions/windows-test
        with:
          bundle: ${{ runner.temp }}/windows-test
          page-heap: ${{ inputs.page-heap }}
          timeout: ${{ inputs.timeout }}
