name: Inno Setup

# Compiles a Windows installer from an Inno Setup script, runs the repo's smoke
# test against it, and optionally uploads it as an artifact for release.yml to
# attach. Run it in CI with a placeholder version so a broken script is caught
# on the pull request rather than at release time.
on:
  workflow_call:
    inputs:
      script:
        description: The .iss script to compile
        type: string
        required: true
      version:
        description: Version passed to the script as /D<version-define>=<version>
        type: string
        required: true
      version-define:
        description: Preprocessor name the script reads the version from
        type: string
        default: AppVersion
      output-dir:
        description: Where the script writes the installer (its OutputDir), relative to the repo
        type: string
        default: dist
      smoke-test:
        description: PowerShell run after compiling, e.g. a script that installs silently and checks the result
        type: string
        default: ""
      artifact:
        description: Upload the installer as an artifact with this name; empty uploads nothing
        type: string
        default: ""
      inno-setup-version:
        description: Chocolatey innosetup package version
        type: string
        default: "6.7.1"

permissions: {}

jobs:
  build:
    name: Build
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Inno Setup
        env:
          INNO_VERSION: ${{ inputs.inno-setup-version }}
        run: choco install innosetup --version "$env:INNO_VERSION" --no-progress -y

      - name: Compile
        env:
          SCRIPT: ${{ inputs.script }}
          VERSION: ${{ inputs.version }}
          DEFINE: ${{ inputs.version-define }}
        run: |
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe" | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found after installing Inno Setup" }
          & $iscc.FullName "/D$env:DEFINE=$env:VERSION" $env:SCRIPT
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE" }

      - name: Smoke test
        if: inputs.smoke-test != ''
        env:
          SMOKE_TEST: ${{ inputs.smoke-test }}
        run: |
          $ErrorActionPreference = "Stop"
          & ([scriptblock]::Create($env:SMOKE_TEST))
          if ($LASTEXITCODE) { exit $LASTEXITCODE }

      - if: inputs.artifact != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact }}
          path: ${{ inputs.output-dir }}/*.exe
          if-no-files-found: error
          retention-days: 14
