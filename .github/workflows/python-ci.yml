name: Python CI

# Installs the project (from its hash-locked dev requirements when present),
# lints it with ruff, runs any extra commands, then the tests, which fail
# below 100% coverage unless coverage-fail-under says otherwise. With
# shell-coverage-source, the bash scripts the tests run are measured too, and
# with node-version and js-coverage-source, the JavaScript ones.
on:
  workflow_call:
    inputs:
      runs-on:
        description: The runner label; a versioned one, such as ubuntu-24.04, keeps the job on one image
        type: string
        default: ubuntu-latest
      python-version:
        type: string
        default: "3.12"
      working-directory:
        type: string
        default: "."
      lock-file:
        description: Hash-locked dev requirements. Without it the project installs with pip install -e ".[dev]".
        type: string
        default: requirements-dev.txt
      ruff:
        type: boolean
        default: true
      ruff-select:
        description: Rules for repos without their own ruff config. A repo's [tool.ruff] or ruff.toml wins.
        type: string
        default: E4,E7,E9,F
      commands:
        description: Extra shell commands run after install and before the tests
        type: string
        default: ""
      test-command:
        description: With coverage on, a Python module and its arguments (run as coverage run -m ...)
        type: string
        default: pytest -q
      coverage:
        description: Fail when test coverage is below coverage-fail-under
        type: boolean
        default: true
      coverage-fail-under:
        type: string
        default: "100"
      shell-coverage-source:
        description: Space-separated scripts or directories (searched for *.sh and *.bash) whose statements the pytest tests must run. Empty leaves shell coverage off
        type: string
        default: ""
      shell-coverage-exclude:
        description: Space-separated globs of scripts to leave out, such as vendored ones the parser can't read
        type: string
        default: ""
      shell-coverage-fail-under:
        description: Minimum percent of shell statements run. Empty reports without failing
        type: string
        default: "100"
      shell-coverage-branch:
        description: Also count the right-hand side of each && and || as a statement that must run
        type: boolean
        default: false
      shell-sandbox:
        description: Provide the shell_sandbox fixture, which runs scripts as root in a disposable user namespace with stubbed commands
        type: boolean
        default: false
      node-version:
        description: Set up this node and install package.json's dependencies with npm ci, putting node_modules/.bin on PATH. Empty leaves node alone
        type: string
        default: ""
      js-coverage-source:
        description: Space-separated scripts or directories (searched for *.js, *.mjs and *.cjs) whose statements the tests must run. Needs node-version and eslint in the devDependencies. Empty leaves JS coverage off
        type: string
        default: ""
      js-coverage-exclude:
        description: Space-separated globs of scripts to leave out, such as vendored or generated ones
        type: string
        default: ""
      js-coverage-fail-under:
        description: Minimum percent of JavaScript statements run. Empty reports without failing
        type: string
        default: "100"
      js-coverage-branch:
        description: "Also count the right side of each && || ?? and each arm of ?: as a statement that must run"
        type: boolean
        default: false

permissions: {}

jobs:
  test:
    name: Tests
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ inputs.python-version }}
          # Downloads only; what is installed still comes from the lock or
          # pyproject.toml, so a stale cache can't change the result.
          cache: pip
          cache-dependency-path: |
            ${{ inputs.working-directory }}/pyproject.toml
            ${{ inputs.working-directory }}/requirements*.txt

      - name: Install
        env:
          LOCK: ${{ inputs.lock-file }}
        run: |
          if [ -f "$LOCK" ]; then
            pip install --require-hashes --no-deps -r "$LOCK"
            # A repo that only uses Python for its tests, such as a Node
            # project tested through pytest-testrex, has nothing to install.
            if grep -qs '^\[project\]' pyproject.toml || [ -f setup.py ]; then
              pip install --no-deps --no-build-isolation -e .
            fi
          else
            pip install -e ".[dev]"
          fi

      - if: inputs.node-version != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: npm
          cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

      # Install scripts are off: the tests need the packages, not whatever a
      # dependency runs at install time.
      - name: Node dependencies
        if: inputs.node-version != ''
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          echo "$PWD/node_modules/.bin" >> "$GITHUB_PATH"

      - if: inputs.ruff
        uses: $/actions/setup-tools

      - name: Ruff
        if: inputs.ruff
        env:
          SELECT: ${{ inputs.ruff-select }}
        run: |
          ruff="$RUNNER_TEMP/workflow-tools/bin/ruff"
          if grep -qs '^\[tool\.ruff' pyproject.toml || [ -f ruff.toml ] || [ -f .ruff.toml ]; then
            "$ruff" check --output-format github .
          else
            "$ruff" check --select "$SELECT" --output-format github .
          fi

      - name: Commands
        if: inputs.commands != ''
        env:
          COMMANDS: ${{ inputs.commands }}
        run: bash -euo pipefail -c "$COMMANDS"

      - name: Shell coverage
        if: inputs.shell-coverage-source != '' || inputs.shell-sandbox
        uses: $/actions/shell-coverage
        with:
          source: ${{ inputs.shell-coverage-source }}
          exclude: ${{ inputs.shell-coverage-exclude }}
          fail-under: ${{ inputs.shell-coverage-fail-under }}
          branch: ${{ inputs.shell-coverage-branch }}
          sandbox: ${{ inputs.shell-sandbox }}

      - name: JavaScript coverage
        if: inputs.js-coverage-source != ''
        uses: $/actions/js-coverage
        with:
          source: ${{ inputs.js-coverage-source }}
          exclude: ${{ inputs.js-coverage-exclude }}
          fail-under: ${{ inputs.js-coverage-fail-under }}
          branch: ${{ inputs.js-coverage-branch }}

      - name: Tests
        if: '!inputs.coverage'
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        run: bash -euo pipefail -c "$TEST_COMMAND"

      - name: Tests with coverage
        if: inputs.coverage
        uses: $/actions/coverage
        with:
          test-command: ${{ inputs.test-command }}
          fail-under: ${{ inputs.coverage-fail-under }}
          working-directory: ${{ inputs.working-directory }}
