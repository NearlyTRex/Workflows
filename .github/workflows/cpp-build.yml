name: C++ Build

# Builds and tests a C or C++ project on one runner, and optionally uploads what
# it built for release.yml to attach. The build itself is the repo's own
# command (cmake, a Setup.py, a packaging script), so this covers any build
# system; what it adds is the setup around it. Pass a matrix from the caller for
# several platforms or configurations:
#
#   strategy:
#     matrix:
#       os: [ubuntu-latest, windows-latest]
#   with:
#     runs-on: ${{ matrix.os }}
#     artifact: app-${{ matrix.os }}
on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        default: ubuntu-latest
      container:
        description: >-
          Image to run the job in, on a Linux runner: a toolchain image such as a console
          homebrew SDK's, pinned by digest (image@sha256:...). Empty runs on the runner itself.
        type: string
        default: ""
      devkitpro:
        description: >-
          A devkitPro platform to build for, in devkitPro's own image pinned here, on a Linux
          runner: switch (devkitA64, libnx, the Switch portlibs and tools, DEVKITPRO set). Not
          with container
        type: string
        default: ""
      submodules:
        description: false, true or recursive
        type: string
        default: "false"
      fetch-depth:
        description: Commits of history to fetch; 0 for all, which git describe needs
        type: number
        default: 1
      local-tag:
        description: >-
          Tag the checked-out commit with this, locally and never pushed, before building. For a
          release build, pass release-check's tag: release.yml only tags the commit after the
          builds, so without it git describe can't name the release it is building.
        type: string
        default: ""
      apt-packages:
        description: Space-separated packages to apt-get install first; skipped on other runners
        type: string
        default: ""
      brew-packages:
        description: Space-separated packages to brew install first; skipped off macOS runners
        type: string
        default: ""
      msvc:
        description: Put the MSVC compiler and tools on PATH first; Windows runners only
        type: boolean
        default: false
      msvc-arch:
        description: vcvarsall architecture, e.g. x64, x86, x64_arm64
        type: string
        default: x64
      msvc-uwp:
        description: >-
          Set MSVC up for UWP apps, such as Xbox Dev Mode homebrew: vcvarsall's uwp mode, which
          links the store CRT, with WindowsApp.lib added to every link through LINK, and makeappx
          and signtool on PATH for ci-msix. Implies msvc; Windows runners only
        type: boolean
        default: false
      llvm-version:
        description: >-
          An LLVM release to install from apt.llvm.org beside the runner's clang, e.g. 23:
          clang-N, clang-tidy-N, clang-format-N, lld-N, llvm-N and libc++; Linux runners only
        type: string
        default: ""
      openorbis-version:
        description: >-
          An OpenOrbis PS4 Toolchain release to install for PS4 homebrew, e.g. 0.5.4, with the LLVM
          release it was built with: OO_PS4_TOOLCHAIN, its tools (create-fself, create-gp4,
          PkgTool.Core) on PATH, and a CMake toolchain file as OPENORBIS_TOOLCHAIN_FILE; Linux
          runners only
        type: string
        default: ""
      cache-paths:
        description: Newline-separated paths to cache between runs, such as fetched dependencies
        type: string
        default: ""
      cache-key-files:
        description: Glob of the files that decide when the cache is stale, e.g. cmake/deps.cmake
        type: string
        default: ""
      cache-key:
        description: >-
          Names the cache, so jobs building the same thing share one (a CI build and a release
          build of one preset). Defaults to the artifact name.
        type: string
        default: ""
      rolling-cache-paths:
        description: >-
          Newline-separated paths saved after every run that isn't cancelled and restored from the
          newest save, as ccache is; for caches that grow with the code, such as ci-clang-tidy's
          --cache-dir. cache-paths, keyed on cache-key-files, suits what changes only with them.
        type: string
        default: ""
      ccache:
        description: >-
          Install ccache, route the compilers through it (CMake's launcher, and ccache's wrappers
          first on PATH for other build systems), and keep its cache between runs, so a build
          recompiles only what changed. Linux and macOS runners.
        type: boolean
        default: false
      ccache-max-size:
        description: Largest the ccache directory may grow, e.g. 500M or 2G
        type: string
        default: 500M
      ccache-sloppiness:
        description: >-
          ccache's sloppiness setting. The default lets it cache compiles that use a precompiled
          header, which it otherwise refuses, and ignores the fresh file times every checkout
          has. Clang also needs -Xclang -fno-pch-timestamp when building the header.
        type: string
        default: pch_defines,time_macros,include_file_mtime,include_file_ctime
      build-command:
        description: Run in bash on every runner (Git Bash on Windows), after any MSVC setup
        type: string
        required: true
      test-command:
        description: Run in bash after the build
        type: string
        default: ""
      artifact:
        description: Upload artifact-path under this name; empty uploads nothing
        type: string
        default: ""
      artifact-path:
        description: Newline-separated paths or globs to upload
        type: string
        default: ""
      parallel:
        description: >-
          Build on every core: sets CMAKE_BUILD_PARALLEL_LEVEL, and MAKEFLAGS=-j off Windows,
          unless the build command's environment already sets them. Plain make runs one job at a
          time otherwise.
        type: boolean
        default: true
      timeout-minutes:
        description: How long the job may run before it is cancelled
        type: number
        default: 90

permissions: {}

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.runs-on }}
    # An empty string is not a valid container, so no image means null. The
    # caller's image is pinned by digest by the caller, as with any other input;
    # devkitpro's are pinned here, and self-tool-versions says when one is out.
    container: ${{ inputs.container || fromJSON('{"switch":"devkitpro/devkita64:20260219@sha256:1fc388c3a0d34bd2045a6dadcb1020e069d5f876a187fd705de14b4440c00282"}')[inputs.devkitpro] || null }} # zizmor: ignore[unpinned-images]
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      # A devkitpro name with no image, or one beside container, would otherwise
      # build on the runner, or in the wrong image, without saying so.
      - name: Check devkitpro
        if: inputs.devkitpro != ''
        shell: bash
        env:
          PLATFORM: ${{ inputs.devkitpro }}
          CONTAINER: ${{ inputs.container }}
        run: |
          if [ "$PLATFORM" != switch ]; then
            echo "::error::devkitpro must be switch, not '$PLATFORM'"; exit 1
          fi
          if [ -n "$CONTAINER" ]; then
            echo "::error::devkitpro runs in devkitPro's image, so it can't be given with container"; exit 1
          fi
          echo "devkitPro $PLATFORM in $DEVKITPRO"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: ${{ inputs.submodules }}
          fetch-depth: ${{ inputs.fetch-depth }}

      # Lightweight, so it needs no git identity, and the same commit release.yml
      # tags afterwards, so the binary and the release agree.
      - name: Tag locally
        if: inputs.local-tag != ''
        shell: bash
        env:
          TAG: ${{ inputs.local-tag }}
        # -f: a re-run after a failed publish may already have the tag.
        run: git tag -f "$TAG" && git describe --tags --always

      # Skipped off Linux, so a matrix can pass one package list to every runner.
      # A container job usually runs as root, without sudo.
      - name: Install packages
        if: inputs.apt-packages != '' && runner.os == 'Linux'
        shell: bash
        env:
          PACKAGES: ${{ inputs.apt-packages }}
        run: |
          read -ra packages <<< "$PACKAGES"
          sudo=""; if [ "$(id -u)" != 0 ]; then sudo="sudo"; fi
          $sudo apt-get update
          $sudo apt-get install -y --no-install-recommends "${packages[@]}"

      - name: Install packages (Homebrew)
        if: inputs.brew-packages != '' && runner.os == 'macOS'
        shell: bash
        env:
          PACKAGES: ${{ inputs.brew-packages }}
        run: |
          read -ra packages <<< "$PACKAGES"
          brew install "${packages[@]}"

      # The same environment a Developer Command Prompt gets, exported to every
      # later step, found with vswhere rather than a hard-coded edition path. In
      # uwp mode, the store libraries must be there for this toolset, or every
      # link would quietly pick the desktop CRT; and the store CRT's startup
      # calls RoInitialize, so LINK, which link.exe reads before its command
      # line, adds WindowsApp.lib to every link, a build system's compiler
      # checks included, ahead of the desktop libraries they name.
      - name: Set up MSVC
        if: inputs.msvc || inputs.msvc-uwp
        shell: pwsh
        env:
          ARCH: ${{ inputs.msvc-arch }}
          UWP: ${{ inputs.msvc-uwp }}
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vs) { throw "No Visual Studio with the C++ tools found" }
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvarsall.bat"
          $mode = if ($env:UWP -eq 'true') { 'uwp' } else { '' }
          $vars = @{}
          cmd /c "`"$vcvars`" $env:ARCH $mode > nul && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') { $vars[$Matches[1]] = $Matches[2] }
          }
          if ($mode) {
            $store = $vars['LIB'] -split ';' | Where-Object { $_ -match '\\store(\\|$)' }
            if (-not $store) { throw "vcvarsall's uwp mode found no store libraries for $env:ARCH in $vs" }
            $vars['LINK'] = "WindowsApp.lib $($vars['LINK'])".Trim()
          }
          $vars.GetEnumerator() | ForEach-Object { "$($_.Key)=$($_.Value)" | Out-File $env:GITHUB_ENV -Append -Encoding utf8 }
          Write-Host "MSVC environment from $vs ($env:ARCH $mode)"

      # LLVM's own repository, for a newer clang and libc++ than the distribution ships.
      - name: Install LLVM
        if: inputs.llvm-version != '' && runner.os == 'Linux'
        uses: $/actions/llvm
        with:
          version: ${{ inputs.llvm-version }}

      # A pinned SDK release, checked against its sha256: see actions/openorbis.
      - name: Install OpenOrbis
        if: inputs.openorbis-version != '' && runner.os == 'Linux'
        uses: $/actions/openorbis
        with:
          version: ${{ inputs.openorbis-version }}

      - name: Cache
        if: inputs.cache-paths != ''
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.cache-paths }}
          key: cpp-build-${{ runner.os }}-${{ inputs.cache-key || inputs.artifact }}-${{ hashFiles(inputs.cache-key-files || 'CMakeLists.txt') }}

      # Parallel jobs on every core, and ccache on Linux and macOS runners: see
      # actions/build-env.
      - name: Build environment
        uses: $/actions/build-env
        with:
          parallel: ${{ inputs.parallel }}
          ccache: ${{ inputs.ccache }}
          ccache-dir: ${{ runner.temp }}/ccache
          ccache-max-size: ${{ inputs.ccache-max-size }}
          ccache-sloppiness: ${{ inputs.ccache-sloppiness }}

      # Every run saves under a new key, and restores the newest earlier one by
      # prefix, so the cache follows the code instead of freezing at its first
      # save. GitHub evicts the least recently used when the repo is full. The @
      # ends the name, so a cache named foo never restores one named foo-bar.
      - name: Restore ccache
        id: ccache
        if: inputs.ccache && (runner.os == 'Linux' || runner.os == 'macOS')
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ runner.os }}-${{ inputs.cache-key || inputs.artifact }}@${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-${{ runner.os }}-${{ inputs.cache-key || inputs.artifact }}@

      - name: Reset ccache statistics
        if: steps.ccache.outcome == 'success'
        shell: bash
        run: ccache --zero-stats

      # Keyed like the ccache, and saved after the tests, which may fill it too.
      - name: Restore rolling cache
        id: rolling
        if: inputs.rolling-cache-paths != ''
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.rolling-cache-paths }}
          key: rolling-${{ runner.os }}-${{ inputs.cache-key || inputs.artifact }}@${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: rolling-${{ runner.os }}-${{ inputs.cache-key || inputs.artifact }}@

      - name: Build
        shell: bash
        env:
          BUILD_COMMAND: ${{ inputs.build-command }}
        run: bash -euo pipefail -c "$BUILD_COMMAND"

      # Verbose, so uncacheable calls are broken down by reason, such as "could
      # not use precompiled header"; it also warns when ccache-max-size is too
      # small for the build.
      - name: ccache statistics
        if: always() && steps.ccache.outcome == 'success'
        uses: $/actions/ccache-stats

      # After a failed or cancelled build too: whatever did compile is worth
      # keeping. The run started from the newest cache and only added to it, so
      # what it saves is never less than it restored; and a job whose cold build
      # outlasts timeout-minutes would otherwise start cold every time.
      - name: Save ccache
        if: always() && steps.ccache.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/ccache
          key: ccache-${{ runner.os }}-${{ inputs.cache-key || inputs.artifact }}@${{ github.run_id }}-${{ github.run_attempt }}

      - name: Test
        if: inputs.test-command != ''
        shell: bash
        env:
          TEST_COMMAND: ${{ inputs.test-command }}
        run: bash -euo pipefail -c "$TEST_COMMAND"

      # As the ccache: ci-clang-tidy prunes its --cache-dir only once every
      # file has run, so a cancelled run's directory still holds all it restored.
      - name: Save rolling cache
        if: always() && steps.rolling.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ inputs.rolling-cache-paths }}
          key: rolling-${{ runner.os }}-${{ inputs.cache-key || inputs.artifact }}@${{ github.run_id }}-${{ github.run_attempt }}

      - if: inputs.artifact != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact }}
          path: ${{ inputs.artifact-path }}
          if-no-files-found: error
          retention-days: 14
