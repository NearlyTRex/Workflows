name: Self Release

on:
  push:
    branches: [main]

permissions: {}

jobs:
  check:
    name: Check
    uses: $/.github/workflows/lint.yml
    permissions:
      contents: read

  release:
    name: Release
    needs: check
    uses: $/.github/workflows/release.yml
    permissions:
      contents: write
    with:
      version-file: VERSION
      title: Workflows
