name: Security

# Supply-chain and secret checks: zizmor over the workflows, gitleaks over the
# whole git history, pip-audit over any hash-locked requirement files, and a
# check that no credential-bearing file (.env, private keys) is tracked at all.
on:
  workflow_call:
    inputs:
      zizmor:
        type: boolean
        default: true
      gitleaks:
        type: boolean
        default: true
      pip-audit-files:
        description: Space-separated hash-locked requirement files to audit
        type: string
        default: ""
      tracked-files:
        description: Fail if a file that could hold a credential (.env, private keys) is tracked
        type: boolean
        default: true
      tracked-files-patterns:
        description: Extra space-separated patterns for tracked-files; "!pattern" makes an exception
        type: string
        default: ""

permissions: {}

jobs:
  zizmor:
    name: Zizmor
    if: inputs.zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/actions/zizmor

  gitleaks:
    name: Gitleaks
    if: inputs.gitleaks
    runs-on: ubuntu-latest
    # A full scan of a large history takes several minutes.
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # Pull requests and pushes scan only their new commits: everything before
      # them was scanned when it landed. Scheduled and manual runs scan the
      # whole history, which also catches anything a new rule now recognises.
      # A push whose earlier commit is unknown (a new branch, a force push)
      # falls back to the whole history rather than risk skipping anything.
      - name: Work out what to scan
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          range=""
          if [ "$EVENT" = "pull_request" ] && [ -n "$PR_BASE" ] && [ -n "$PR_HEAD" ]; then
            range="$PR_BASE..$PR_HEAD"
          elif [ "$EVENT" = "push" ] && [ -n "$BEFORE" ] && [ "${BEFORE//0/}" != "" ] \
              && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            range="$BEFORE..$AFTER"
          fi
          if [ -n "$range" ]; then
            echo "Scanning the new commits: $range ($(git rev-list --count "$range") commits)"
          else
            echo "Scanning the whole history ($(git rev-list --count HEAD) commits)"
          fi
          echo "log-opts=$range" >> "$GITHUB_OUTPUT"

      - uses: $/actions/gitleaks
        with:
          log-opts: ${{ steps.range.outputs.log-opts }}

  pip-audit:
    name: Pip Audit
    if: inputs.pip-audit-files != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/actions/setup-tools
      - name: pip-audit
        env:
          FILES: ${{ inputs.pip-audit-files }}
        run: |
          args=()
          for file in $FILES; do args+=(-r "$file"); done
          "$RUNNER_TEMP/workflow-tools/bin/pip-audit" --require-hashes --disable-pip --strict --progress-spinner off "${args[@]}"

  tracked-files:
    name: Tracked Files
    if: inputs.tracked-files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/actions/check-tracked-files
        with:
          patterns: ${{ inputs.tracked-files-patterns }}
