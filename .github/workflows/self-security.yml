name: Self Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.ref }}
  # Only pull requests: a newer push supersedes their run. On main every run
  # finishes, since each push's secret scan covers only that push's commits.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security:
    name: Security
    uses: $/.github/workflows/security.yml
    permissions:
      contents: read
    with:
      pip-audit-files: >-
        requirements-dev.txt actions/setup-tools/requirements.txt actions/coverage/requirements.txt
        actions/clang-format/requirements.txt
        tests/fixtures/python-app/requirements.txt tests/fixtures/python-app/requirements-dev.txt

  codeql:
    name: CodeQL
    uses: $/.github/workflows/codeql.yml
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      languages: '["python", "actions"]'

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    uses: $/.github/workflows/dependency-review.yml
    permissions:
      contents: read

  container-scan:
    name: Container Scan
    uses: $/.github/workflows/container-scan.yml
    permissions:
      contents: read
    with:
      dockerfile: tests/fixtures/python-app/Dockerfile
      context: tests/fixtures/python-app
      config-scan: true
