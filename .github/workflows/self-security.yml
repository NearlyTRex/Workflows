name: self security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    uses: $/.github/workflows/security.yml
    permissions:
      contents: read
    with:
      pip-audit-files: requirements-dev.lock actions/setup-tools/requirements.lock tests/fixtures/python-app/requirements-dev.lock

  codeql:
    uses: $/.github/workflows/codeql.yml
    permissions:
      actions: read
      contents: read
      security-events: write
    with:
      languages: '["python", "actions"]'

  dependency-review:
    if: github.event_name == 'pull_request'
    uses: $/.github/workflows/dependency-review.yml
    permissions:
      contents: read

  container-scan:
    uses: $/.github/workflows/container-scan.yml
    permissions:
      contents: read
    with:
      dockerfile: tests/fixtures/python-app/Dockerfile
      context: tests/fixtures/python-app
