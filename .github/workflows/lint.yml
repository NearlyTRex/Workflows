name: Lint

# Language-agnostic checks: shellcheck on tracked shell scripts, markdownlint
# rules on Markdown (rumdl, using the repo's .markdownlint.* or rumdl config when
# it has one) plus a check that every code fence closes, and every tracked JSON
# file must parse. Each is skipped when there is nothing to check.
on:
  workflow_call:
    inputs:
      shellcheck:
        type: boolean
        default: true
      markdown:
        type: boolean
        default: true
      json:
        type: boolean
        default: true
      yaml:
        description: >-
          Lint every tracked YAML file with yamllint: the repo's .yamllint config when it has
          one, otherwise only real errors, such as invalid syntax and duplicate keys.
        type: boolean
        default: true
      actionlint:
        description: Check the workflows with actionlint, including a shellcheck of their scripts
        type: boolean
        default: true

permissions: {}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: inputs.shellcheck || inputs.markdown || inputs.yaml
        uses: $/actions/setup-tools

      - name: shellcheck
        if: inputs.shellcheck
        uses: $/actions/shellcheck

      - name: Markdown
        if: inputs.markdown
        run: '"$RUNNER_TEMP/workflow-tools/bin/rumdl" check --output-format github .'

      - name: Markdown fences
        if: inputs.markdown
        uses: $/actions/check-markdown-fences

      - name: JSON
        if: inputs.json
        uses: $/actions/check-json

      # With the repo's own config, its warnings show as annotations too.
      # Without one, only errors: the relaxed preset's style warnings would
      # flood a repo that never opted into a YAML style.
      - name: YAML
        if: inputs.yaml
        run: |
          yamllint="$RUNNER_TEMP/workflow-tools/bin/yamllint"
          if [ -f .yamllint ] || [ -f .yamllint.yaml ] || [ -f .yamllint.yml ]; then
            options=()
          else
            options=(--no-warnings -d "{extends: relaxed, rules: {line-length: disable}}")
          fi
          git ls-files -z '*.yml' '*.yaml' | xargs -0 -r "$yamllint" --format github "${options[@]}"

      - name: Workflows
        if: inputs.actionlint
        uses: $/actions/actionlint
