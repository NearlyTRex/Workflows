name: Lint

# Language-agnostic checks: shellcheck on tracked shell scripts, markdownlint
# rules on Markdown (rumdl, using the repo's .markdownlint.* or rumdl config when
# it has one) plus a check that every code fence closes, and every tracked JSON
# file must parse. Each is skipped when there is nothing to check.
on:
  workflow_call:
    inputs:
      shellcheck:
        type: boolean
        default: true
      markdown:
        type: boolean
        default: true
      json:
        type: boolean
        default: true

permissions: {}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: inputs.shellcheck || inputs.markdown
        uses: $/actions/setup-tools

      - name: shellcheck
        if: inputs.shellcheck
        run: |
          git ls-files -z '*.sh' '*.bash' \
            | xargs -0 -r "$RUNNER_TEMP/workflow-tools/bin/shellcheck" --format gcc

      - name: Markdown
        if: inputs.markdown
        run: '"$RUNNER_TEMP/workflow-tools/bin/rumdl" check --output-format github .'

      - name: Markdown fences
        if: inputs.markdown
        uses: $/actions/check-markdown-fences

      - name: JSON
        if: inputs.json
        uses: $/actions/check-json
