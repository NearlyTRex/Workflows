[project]
name = "fixture-app"
version = "0.0.0"
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["fixture_app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
